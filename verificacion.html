<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12131A">
  <title>Stop · Verificación de victoria</title>
  <link rel="icon" href="img/icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tono.css">
  <link rel="stylesheet" href="css/style.css">
  <!-- Tema y acento se aplican antes de pintar para evitar parpadeos -->
  <script src="js/nucleo/almacenamiento.js"></script>
  <script src="js/tono.js"></script>
</head>
<body>
  <div id="barra"></div>
  <main class="contenido">

    <section id="pantalla-sin-partida" class="tarjeta tarjeta--centro" hidden>
      <h1 class="tarjeta__titulo">No hay una partida para verificar</h1>
      <p class="tarjeta__subtitulo">Juega la partida y registra las palabras de cada ronda.</p>
      <a class="boton boton--primario" href="partida.html">Ir a la partida</a>
    </section>

    <div id="pantalla-verificacion" class="contenido" style="width: 100%; padding: 0" hidden>
      <section class="tarjeta">
        <div class="chips" style="justify-content: space-between; align-items: center">
          <div>
            <h1 class="tarjeta__titulo">Verificación de victoria</h1>
            <p class="tarjeta__subtitulo">Anota los puntos que dice tener cada jugador. Se audita al que declare más.</p>
          </div>
          <a class="boton boton--pequeno" href="partida.html">Volver a la partida</a>
        </div>
        <form class="formulario-linea" id="formulario-declaracion">
          <input id="entrada-nombre" type="text" maxlength="20" autocomplete="off" aria-label="Nombre del jugador" placeholder="Nombre">
          <input id="entrada-puntos" type="number" min="0" max="99999" inputmode="numeric" aria-label="Puntos que declara" placeholder="Puntos">
          <button class="boton boton--pequeno boton--primario" type="submit">Anotar jugador</button>
        </form>
        <p class="aviso" id="mensaje-declaracion" role="status"></p>
        <div id="lista-declaraciones"></div>
      </section>

      <div id="zona-auditoria" class="contenido" style="width: 100%; padding: 0"></div>
    </div>
  </main>

  <script src="js/nucleo/dom.js"></script>
  <script src="js/nucleo/iconos.js"></script>
  <script src="js/nucleo/tiempo.js"></script>
  <script src="js/nucleo/letras.js"></script>
  <script src="js/nucleo/categorias.js"></script>
  <script src="js/nucleo/puntuacion.js"></script>
  <script src="js/nucleo/codigo-sala.js"></script>
  <script src="js/barra.js"></script>
  <script src="js/vistas/verificacion.js"></script>
</body>
</html>
