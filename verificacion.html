<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12131A">
  <title>Stop · Verificación</title>
  <link rel="icon" href="img/icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tono.css">
  <link rel="stylesheet" href="css/style.css">
  <!-- Tema y acento se aplican antes de pintar para evitar parpadeos -->
  <script src="js/nucleo/almacenamiento.js"></script>
  <script src="js/tono.js"></script>
</head>
<body>
  <div id="barra"></div>
  <main class="contenido">

    <!-- Carga de la sala (si este navegador no la generó) -->
    <section id="pantalla-carga" class="tarjeta" style="max-width: 560px; margin: 0 auto" hidden>
      <h1 class="tarjeta__titulo">Verificación de victoria</h1>
      <p class="tarjeta__subtitulo">Pega el código de sala para cargar las reglas de la partida.</p>
      <form id="formulario-carga" class="contenido" style="width: 100%; gap: 14px; padding: 0">
        <div class="campo"><label class="etiqueta" for="entrada-codigo">Código de sala</label><input id="entrada-codigo" type="text" autocomplete="off" spellcheck="false"></div>
        <p class="aviso" id="mensaje-carga" role="status"></p>
        <button class="boton boton--primario" type="submit">Cargar sala</button>
      </form>
    </section>

    <!-- Auditoría -->
    <div id="pantalla-verificacion" class="contenido" style="width: 100%; padding: 0" hidden>
      <section class="fila-tarjetas">
        <div class="tarjeta">
          <span class="etiqueta" id="sala-verificada"></span>
          <div class="campo"><label class="etiqueta" for="entrada-participante">Jugador auditado</label><input id="entrada-participante" type="text" maxlength="20" autocomplete="off"></div>
          <div class="campo"><label class="etiqueta" for="entrada-declarados">Puntos que declara</label><input id="entrada-declarados" type="number" min="0" inputmode="numeric"></div>
        </div>
        <div class="tarjeta">
          <span class="etiqueta" id="etiqueta-rondas">Rondas</span>
          <div class="chips" id="pestanas-rondas" role="group" aria-labelledby="etiqueta-rondas"></div>
        </div>
      </section>

      <section class="fila-tarjetas">
        <div class="tarjeta" style="flex: 3">
          <span class="etiqueta" id="titulo-palabras"></span>
          <div id="filas-palabras" class="contenido" style="width: 100%; gap: 10px; padding: 0"></div>
        </div>
        <div class="tarjeta" style="flex: 2">
          <span class="etiqueta">Tiempo de la ronda (HH:MM:SS)</span>
          <div class="fila-tiempo"><label for="entrada-inicio">Inicio</label><input id="entrada-inicio" type="text" inputmode="numeric" placeholder="14:34:00" autocomplete="off"></div>
          <div class="fila-tiempo"><label for="entrada-cierre">Cierre oficial</label><input id="entrada-cierre" type="text" inputmode="numeric" placeholder="14:34:40" autocomplete="off"></div>
          <div class="fila-tiempo"><label for="entrada-fin">Hora final del jugador</label><input id="entrada-fin" type="text" inputmode="numeric" placeholder="14:34:46" autocomplete="off"></div>
          <div class="fila-tiempo"><span>Exceso tras la gracia</span><strong id="exceso">—</strong></div>
          <div class="fila-tiempo"><span>Penalización</span><strong id="penalizacion">—</strong></div>
          <p class="tarjeta__subtitulo" id="aviso-tiempo"></p>
          <div class="total-ronda"><span class="etiqueta">Ronda</span><strong id="total-ronda">0 pts</strong></div>
        </div>
      </section>

      <section class="tarjeta tarjeta--centro">
        <span class="etiqueta">Total auditado</span>
        <p class="codigo-grande" id="total-auditado">0 pts</p>
        <p class="tarjeta__subtitulo" id="comparacion" role="status"></p>
        <button class="boton boton--pequeno" type="button" id="boton-reiniciar">Reiniciar verificación</button>
      </section>
    </div>
  </main>

  <script src="js/nucleo/dom.js"></script>
  <script src="js/nucleo/iconos.js"></script>
  <script src="js/nucleo/tiempo.js"></script>
  <script src="js/nucleo/letras.js"></script>
  <script src="js/nucleo/categorias.js"></script>
  <script src="js/nucleo/puntuacion.js"></script>
  <script src="js/nucleo/codigo-sala.js"></script>
  <script src="js/barra.js"></script>
  <script src="js/vistas/verificacion.js"></script>
</body>
</html>
