<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12131A">
  <title>Stop · Jugador</title>
  <link rel="icon" href="img/icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tono.css">
  <link rel="stylesheet" href="css/style.css">
  <!-- Tema y acento se aplican antes de pintar para evitar parpadeos -->
  <script src="js/nucleo/almacenamiento.js"></script>
  <script src="js/tono.js"></script>
</head>
<body>
  <div id="barra"></div>
  <main class="contenido contenido--estrecho">

    <!-- 1. Ingreso -->
    <section id="pantalla-ingreso" class="tarjeta">
      <h1 class="tarjeta__titulo">Unirme a una sala</h1>
      <p class="tarjeta__subtitulo">Pega el código que te compartió el anfitrión y escribe tu nombre.</p>
      <form id="formulario-ingreso" class="contenido" style="width: 100%; gap: 14px; padding: 0">
        <div class="campo"><label class="etiqueta" for="entrada-codigo">Código de sala</label><input id="entrada-codigo" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
        <div class="campo"><label class="etiqueta" for="entrada-jugador">Tu nombre</label><input id="entrada-jugador" type="text" maxlength="20" autocomplete="nickname"></div>
        <p class="aviso" id="mensaje-ingreso" role="status"></p>
        <button class="boton boton--primario" type="submit">Entrar a la sala</button>
      </form>
    </section>

    <!-- 2. Ronda -->
    <section id="pantalla-ronda" hidden>
      <div class="contenido" style="width: 100%; padding: 0">
        <div class="chips" style="justify-content: space-between; align-items: center">
          <span style="font-weight: 800" id="ronda-sala"></span>
          <span class="chip" id="ronda-numero"></span>
        </div>
        <div class="tarjeta letra-tarjeta">
          <div class="insignia" id="letra-insignia" role="img"><div class="insignia__letra" id="letra-actual" aria-hidden="true"></div></div>
          <div style="display: flex; flex-direction: column; gap: 8px; align-items: flex-start">
            <span class="etiqueta">Letra de la ronda</span>
            <span class="tarjeta__subtitulo" id="hora-inicio"></span>
            <button class="boton boton--primario boton--pequeno" type="button" id="boton-iniciar">Iniciar ronda</button>
          </div>
        </div>
        <div id="campos" class="contenido" style="width: 100%; gap: 14px; padding: 0"></div>
        <div id="coordinacion" class="tarjeta" hidden></div>
      </div>
    </section>

    <!-- 3. Puntos totales -->
    <section id="pantalla-final" class="contenido" style="width: 100%; padding: 0" hidden>
      <div class="tarjeta tarjeta--centro">
        <span class="etiqueta">Puntos totales</span>
        <p class="codigo-grande" id="total-puntos">0</p>
        <p class="tarjeta__subtitulo" id="final-jugador"></p>
        <p class="tarjeta__subtitulo">El anfitrión audita estos datos si tienes la mayor puntuación.</p>
      </div>
      <div class="tarjeta" id="detalle-final"></div>
      <div class="chips">
        <button class="boton" type="button" id="boton-volver">Volver a la ronda</button>
        <button class="boton boton--pequeno" type="button" id="boton-nueva">Nueva partida</button>
      </div>
    </section>
  </main>

  <!-- Siempre visible abajo: hora con segundos y STOP -->
  <div class="barra-accion" id="barra-accion" hidden>
    <div class="barra-accion__hora"><span class="etiqueta">Hora</span><strong id="hora-actual" aria-live="off">--:--:--</strong></div>
    <button class="boton boton--primario boton-stop" type="button" id="boton-stop" disabled>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Octágono de parada"><path d="M8 2h8l6 6v8l-6 6H8l-6-6V8z"/></svg>
      Stop
    </button>
  </div>

  <script src="js/nucleo/dom.js"></script>
  <script src="js/nucleo/iconos.js"></script>
  <script src="js/nucleo/tiempo.js"></script>
  <script src="js/nucleo/letras.js"></script>
  <script src="js/nucleo/categorias.js"></script>
  <script src="js/nucleo/puntuacion.js"></script>
  <script src="js/nucleo/codigo-sala.js"></script>
  <script src="js/barra.js"></script>
  <script src="js/vistas/jugador.js"></script>
</body>
</html>
