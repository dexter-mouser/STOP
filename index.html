<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12131A">
  <title>Stop · Juego de palabras</title>
  <link rel="icon" href="img/icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tono.css">
  <link rel="stylesheet" href="css/style.css">
  <!-- Tema y acento se aplican antes de pintar para evitar parpadeos -->
  <script src="js/nucleo/almacenamiento.js"></script>
  <script src="js/tono.js"></script>
</head>
<body>
  <div id="barra"></div>
  <main class="contenido">
    <section class="heroe">
      <div class="heroe__texto">
        <h1 class="heroe__titulo">¡Piensa rápido y grita Stop!</h1>
        <p class="heroe__subtitulo">Un juego de palabras para jugar entre amigos: el anfitrión lleva la partida en la computadora y cada jugador escribe desde su celular.</p>
        <div class="chips">
          <span class="chip">Letras al azar</span>
          <span class="chip">Reloj con segundos</span>
          <span class="chip">Puntos por palabra</span>
          <span class="chip">Tu color favorito</span>
        </div>
        <div class="heroe__botones">
          <a class="boton boton--primario" href="anfitrion.html">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Pantalla"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
            Anfitrión
          </a>
          <a class="boton boton--contorno" href="jugador.html">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Celular"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M12 18h.01"/></svg>
            Jugador
          </a>
          <button class="boton" type="button" id="boton-como-jugar">Cómo jugar</button>
        </div>
      </div>
      <svg class="ilustracion" viewBox="0 0 420 300" role="img" aria-label="Ilustración: tarjeta de respuestas, letra M y reloj">
        <rect class="il-tarjeta" x="1" y="1" width="250" height="250" rx="24"/>
        <rect class="il-barra" x="24" y="26" width="204" height="30" rx="10"/>
        <rect class="il-barra il-barra--activa" x="24" y="70" width="204" height="30" rx="10"/>
        <rect class="il-barra" x="24" y="114" width="204" height="30" rx="10"/>
        <rect class="il-barra" x="24" y="158" width="204" height="30" rx="10"/>
        <rect class="il-barra" x="24" y="202" width="204" height="30" rx="10"/>
        <circle class="il-circulo" cx="345" cy="75" r="75"/>
        <circle class="il-interior" cx="345" cy="75" r="44"/>
        <text class="il-letra" x="345" y="92" text-anchor="middle" font-size="46" font-family="system-ui, sans-serif">M</text>
        <circle class="il-aro" cx="339" cy="213" r="40"/>
        <text class="il-hora" x="339" y="221" text-anchor="middle" font-size="22" font-family="system-ui, sans-serif">14:31</text>
      </svg>
    </section>
  </main>

  <script src="js/nucleo/dom.js"></script>
  <script src="js/nucleo/iconos.js"></script>
  <script src="js/nucleo/tiempo.js"></script>
  <script src="js/nucleo/letras.js"></script>
  <script src="js/nucleo/categorias.js"></script>
  <script src="js/nucleo/puntuacion.js"></script>
  <script src="js/nucleo/codigo-sala.js"></script>
  <script src="js/barra.js"></script>
  <script src="js/vistas/inicio.js"></script>
</body>
</html>
